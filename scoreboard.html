<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scoreboard | St. Peter Trivia</title><link rel="stylesheet" href="styles.css"></head><body><main class="stage"><div class="board"><h1>Scoreboard</h1><div id="board"></div></div></main><script src="game.js"></script><script>function render(){const s=loadState(),a=[...s.teams].sort((a,b)=>b.score-a.score);board.innerHTML=a.map((t,i)=>'<div class="row"><b>'+(i+1)+'</b><span>'+t.name+'</span><b>'+t.score+'</b></div>').join("")||"<h2>Waiting for teams…</h2>"}render();setInterval(render,1000)</script></body></html>
