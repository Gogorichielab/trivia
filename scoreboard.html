<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scoreboard | St. Peter Trivia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <div class="board">
      <h1>Scoreboard</h1>
      <div id="board"></div>
    </div>
  </main>
  <script src="game.js"></script>
  <script src="sync.js"></script>
  <script>
    let lastBoard = "";
    function render() {
      const ranked = rankTeams(loadState().teams);
      const html = ranked.map((team) =>
        `<div class="row"><b>${team.rank}</b><span>${esc(team.name)}</span><b>${esc(team.score)}</b></div>`
      ).join("") || "<h2>Waiting for teams…</h2>";
      if (html === lastBoard) return;
      lastBoard = html;
      board.innerHTML = html;
      board.classList.remove("screen-change");
      requestAnimationFrame(() => board.classList.add("screen-change"));
    }
    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
