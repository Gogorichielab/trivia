<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Host | St. Peter Trivia</title><link rel="stylesheet" href="styles.css"></head><body><main class="host"><h1>Host Console</h1><p id="gameCode"></p><div class="controls"><button onclick="back()">← Back</button><button onclick="next()">Next →</button><button onclick="showBoard()">Show Scoreboard</button><button onclick="resetGame()" class="danger">Reset</button></div><section class="team"><h2>Current State</h2><div id="current"></div></section><h2>Teams & Scores</h2><div id="teams" class="grid"></div><div class="controls"><button onclick="addTeam()">+ Add Team</button></div><h2>Load Game JSON</h2><input type="file" id="file" accept=".json"><p class="hint">For tonight's MVP, screens on different laptops need Firebase sync added/configured. Without it, use this host locally or Plan B.</p></main><script src="game.js"></script><script>let s=loadState(),g=loadGame(),states=flatten(g);gameCode.textContent="Game: "+(new URLSearchParams(location.search).get("game")||"default");function render(){states=flatten(g);const x=states[Math.min(s.index,states.length-1)];current.innerHTML="<b>"+x.type.toUpperCase()+"</b><p>"+(x.title||x.text||"")+"</p>"+(x.type==="answer"?"<p>Answer: "+x.answer+"</p>":"");teams.innerHTML="";s.teams.forEach((t,i)=>{let d=document.createElement("div");d.className="team";d.innerHTML='<input value="'+t.name+'" onchange="rename('+i+',this.value)"><div class="score">'+t.score+' pts</div><button class="small" onclick="score('+i+',-1)">−</button> <button class="small" onclick="score('+i+',1)">+</button>';teams.appendChild(d)})}function commit(){saveState(s);render()}function next(){s.index=Math.min(s.index+1,states.length-1);commit()}function back(){s.index=Math.max(0,s.index-1);commit()}function addTeam(){s.teams.push({name:"Team "+(s.teams.length+1),score:0});commit()}function rename(i,v){s.teams[i].name=v;commit()}function score(i,n){s.teams[i].score+=n;commit()}function showBoard(){localStorage.setItem(gameKey()+":mode","scoreboard");alert("Open scoreboard.html?game="+(new URLSearchParams(location.search).get("game")||"default"))}function resetGame(){if(confirm("Reset game state and scores?")){s={index:0,teams:[]};commit()}}file.onchange=async e=>{try{g=JSON.parse(await e.target.files[0].text());saveGame(g);s.index=0;commit();alert("Game loaded.")}catch(err){alert("Invalid JSON: "+err.message)}};render()</script></body></html>
