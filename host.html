<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Host | St. Peter Trivia</title><link rel="stylesheet" href="styles.css"></head><body><main class="host"><h1>Host Console</h1><p id="gameCode"></p><p id="syncBadge" class="badge"></p><div class="controls"><button onclick="back()">← Back</button><button onclick="next()">Next →</button><button onclick="showBoard()">Show Scoreboard</button><button onclick="resetGame()" class="danger">Reset</button></div><section id="timerPanel" class="timerpanel" hidden><h2>Question Timer</h2><p id="timerReadout" class="timerreadout none" role="timer" aria-live="off" aria-atomic="true" aria-label="No timer running">—</p><div class="controls"><button onclick="timerRestart()">Restart timer</button><button id="timerToggle" onclick="timerTogglePause()">Pause timer</button><button onclick="timerClear()">Clear timer</button></div><p class="hint" id="timerHint"></p></section><section class="team"><h2>Current State</h2><div id="current"></div></section><h2>Teams & Scores</h2><div id="teams" class="grid"></div><div class="controls"><button onclick="addTeam()">+ Add Team</button></div><h2>Load Questions or Teams</h2><input type="file" id="file" aria-label="Load a questions sheet, team list or game file" accept=".json,.csv,.tsv,.xlsx,.xls,.xlsm"><p class="hint">Takes a questions sheet, a team list, or a game file (.csv, .xlsx or .json). Which one it is, is worked out from the column headings. Load them one at a time.</p><pre id="importLog" class="log" hidden></pre></main><script src="vendor/papaparse.min.js"></script><script src="vendor/xlsx.full.min.js"></script><script src="game.js"></script><script src="import.js"></script><script src="timer.js"></script><script src="sync.js"></script><script>let s=loadState(),g=loadGame(),states=flatten(g);gameCode.textContent="Game: "+(new URLSearchParams(location.search).get("game")||"default");function render(){states=flatten(g);const x=states[Math.min(s.index,states.length-1)];current.innerHTML="<b>"+esc(x.type).toUpperCase()+"</b><p>"+esc(x.title||x.text||"")+"</p>"+(x.type==="answer"?"<p>Answer: "+esc(x.answer)+"</p>":"");teams.innerHTML="";s.teams.forEach((t,i)=>{let d=document.createElement("div");d.className="team";d.innerHTML='<input aria-label="Team name" value="'+esc(t.name)+'" onchange="rename('+i+',this.value)"><div class="score">'+esc(t.score)+' pts</div><button class="small" aria-label="Subtract a point from '+esc(t.name)+'" onclick="score('+i+',-1)">−</button> <button class="small" aria-label="Add a point to '+esc(t.name)+'" onclick="score('+i+',1)">+</button>';teams.appendChild(d)});timerPaint()}function commit(){saveState(s);render()}function next(){s.index=Math.min(s.index+1,states.length-1);timerFollowIndex();commit()}function back(){s.index=Math.max(0,s.index-1);timerFollowIndex();commit()}function addTeam(){s.teams.push({name:"Team "+(s.teams.length+1),score:0});commit()}function rename(i,v){s.teams[i].name=v;commit()}function score(i,n){s.teams[i].score+=n;commit()}function showBoard(){localStorage.setItem(gameKey()+":mode","scoreboard");alert("Open scoreboard.html?game="+(new URLSearchParams(location.search).get("game")||"default"))}function resetGame(){if(confirm("Reset game state and scores?")){s={index:0,teams:[]};commit()}}function log(msg,bad){importLog.hidden=false;importLog.textContent=msg;importLog.className="log"+(bad?" bad":" good")}
file.onchange=async e=>{const f=e.target.files[0];if(!f)return;
try{const r=await importFile(f);
if(r.kind==="teams"){s.teams=r.teams;commit();log("Loaded "+r.teams.length+" teams from "+f.name+":\n"+r.teams.map(t=>"  • "+t.name).join("\n"))}
else{g=r.game;saveGame(g);s.index=0;commit();const n=summarizeGame(g);
log("Loaded "+n.questions+" questions in "+n.rounds+" rounds from "+f.name+"\n"
+g.rounds.map((rd,i)=>"  • "+rd.name+" — "+n.perRound[i]+" questions").join("\n")
+"\n  • Tiebreaker: "+(n.hasTiebreaker?"yes":"MISSING"))}}
catch(err){log("Could not load "+f.name+"\n\n"+err.message,true)}
finally{e.target.value=""}};const TIMER_KEY=gameKey()+":timer",timerCfg=timerConfig(location.search,TIMER_KEY);
/* Leaving the timer off must leave no trace of it on the other screens, so a
   game that ran with one earlier drops it here rather than stranding a stale
   countdown on the display. */
if(!timerCfg.enabled&&s.timer){s.timer=null;saveState(s)}
if(timerCfg.enabled){timerPanel.hidden=false;timerHint.textContent=Math.round(timerCfg.duration/1000)+"s per question, started automatically. It never blocks Next or Back \u2014 when it runs out it just says so."}
function timerPaint(){const v=timerView(s.timer,Date.now());timerReadout.textContent=v.visible?v.text:"\u2014";timerReadout.setAttribute("aria-label",v.visible?v.label:"No timer running");timerReadout.className="timerreadout "+v.state;timerToggle.textContent=isTimerRunning(s.timer)?"Pause timer":"Resume timer";timerToggle.disabled=!s.timer}
function timerRestart(){s.timer=startTimer(timerCfg.duration,Date.now());commit()}
function timerTogglePause(){if(!s.timer)return;s.timer=isTimerRunning(s.timer)?pauseTimer(s.timer,Date.now()):resumeTimer(s.timer,Date.now());commit()}
function timerClear(){s.timer=null;commit()}
/* A question gets a fresh countdown; a round card or an answer clears it.
   This follows where the host has already gone -- it never decides. */
function timerFollowIndex(){if(!timerCfg.enabled)return;const x=states[Math.min(s.index,states.length-1)];s.timer=x&&x.type==="question"?startTimer(timerCfg.duration,Date.now()):null}
/* Ticks the readout only. State is written on host actions, never on a tick,
   so a running timer does not post to the worker four times a second. */
if(timerCfg.enabled)setInterval(timerPaint,250);
window.addEventListener("trivia-sync-state",()=>{s=loadState();g=loadGame();states=flatten(g);render()});onSyncStatus((s,detail)=>{const labels={off:"Sync off — this laptop only",connecting:"Sync connecting…",live:"Sync live",offline:"Sync offline",error:"Sync error"};syncBadge.textContent=(labels[s]||s)+(detail?" — "+detail:"");syncBadge.className="badge "+s});render()</script></body></html>
