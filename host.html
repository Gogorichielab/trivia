<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Host | St. Peter Trivia</title><link rel="stylesheet" href="styles.css"></head><body><main class="host"><h1>Host Console</h1><p id="gameCode"></p><p id="syncBadge" class="badge"></p><div class="controls"><button onclick="back()">← Back</button><button onclick="next()">Next →</button><button onclick="showBoard()">Show Scoreboard</button><button onclick="resetGame()" class="danger">Reset</button></div><section class="team"><h2>Current State</h2><div id="current"></div></section><h2>Teams & Scores</h2><div id="teams" class="grid"></div><div class="controls"><button onclick="addTeam()">+ Add Team</button></div><h2>Load Questions or Teams</h2><input type="file" id="file" aria-label="Load a questions sheet, team list or game file" accept=".json,.csv,.tsv,.xlsx,.xls,.xlsm"><p class="hint">Takes a questions sheet, a team list, or a game file (.csv, .xlsx or .json). Which one it is, is worked out from the column headings. Load them one at a time.</p><pre id="importLog" class="log" hidden></pre></main><script src="vendor/papaparse.min.js"></script><script src="vendor/xlsx.full.min.js"></script><script src="game.js"></script><script src="import.js"></script><script src="sync.js"></script><script>let s=loadState(),g=loadGame(),states=flatten(g);gameCode.textContent="Game: "+(new URLSearchParams(location.search).get("game")||"default");function render(){states=flatten(g);const x=states[Math.min(s.index,states.length-1)];current.innerHTML="<b>"+esc(x.type).toUpperCase()+"</b><p>"+esc(x.title||x.text||"")+"</p>"+(x.type==="answer"?"<p>Answer: "+esc(x.answer)+"</p>":"");teams.innerHTML="";s.teams.forEach((t,i)=>{let d=document.createElement("div");d.className="team";d.innerHTML='<input aria-label="Team name" value="'+esc(t.name)+'" onchange="rename('+i+',this.value)"><div class="score">'+esc(t.score)+' pts</div><button class="small" aria-label="Subtract a point from '+esc(t.name)+'" onclick="score('+i+',-1)">−</button> <button class="small" aria-label="Add a point to '+esc(t.name)+'" onclick="score('+i+',1)">+</button>';teams.appendChild(d)})}function commit(){saveState(s);render()}function next(){s.index=Math.min(s.index+1,states.length-1);commit()}function back(){s.index=Math.max(0,s.index-1);commit()}function addTeam(){s.teams.push({name:"Team "+(s.teams.length+1),score:0});commit()}function rename(i,v){s.teams[i].name=v;commit()}function score(i,n){s.teams[i].score+=n;commit()}function showBoard(){localStorage.setItem(gameKey()+":mode","scoreboard");alert("Open scoreboard.html?game="+(new URLSearchParams(location.search).get("game")||"default"))}function resetGame(){if(confirm("Reset game state and scores?")){s={index:0,teams:[]};commit()}}function log(msg,bad){importLog.hidden=false;importLog.textContent=msg;importLog.className="log"+(bad?" bad":" good")}
file.onchange=async e=>{const f=e.target.files[0];if(!f)return;
try{const r=await importFile(f);
if(r.kind==="teams"){s.teams=r.teams;commit();log("Loaded "+r.teams.length+" teams from "+f.name+":\n"+r.teams.map(t=>"  • "+t.name).join("\n"))}
else{g=r.game;saveGame(g);s.index=0;commit();const n=summarizeGame(g);
log("Loaded "+n.questions+" questions in "+n.rounds+" rounds from "+f.name+"\n"
+g.rounds.map((rd,i)=>"  • "+rd.name+" — "+n.perRound[i]+" questions").join("\n")
+"\n  • Tiebreaker: "+(n.hasTiebreaker?"yes":"MISSING"))}}
catch(err){log("Could not load "+f.name+"\n\n"+err.message,true)}
finally{e.target.value=""}};onSyncStatus((s,detail)=>{const labels={off:"Sync off — this laptop only",connecting:"Sync connecting…",live:"Sync live",offline:"Sync offline",error:"Sync error"};syncBadge.textContent=(labels[s]||s)+(detail?" — "+detail:"");syncBadge.className="badge "+s});render()</script></body></html>
