<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Display | St. Peter Trivia</title><link rel="stylesheet" href="styles.css"></head><body><main id="stage" class="stage"></main><div id="timerBar" class="timerbar none" role="timer" aria-live="off" aria-atomic="true" hidden></div><script src="game.js"></script><script src="timer.js"></script><script src="sync.js"></script><script>function render(){const g=loadGame(),s=loadState(),x=s.view||flatten(g)[s.index]||{},roundName=x.roundName||(g.rounds[x.round]||{}).name||"";if(x.type==="round")stage.innerHTML='<div><div class="meta">NEXT ROUND</div><h1 class="round">'+esc(x.title)+'</h1></div>';else if(x.type==="question")stage.innerHTML='<div><div class="meta">'+esc(roundName)+' • Question '+((x.question??x.q)+1)+'</div><h1>'+esc(x.text)+'</h1></div>';else if(x.type==="answer")stage.innerHTML='<div><div class="meta">ANSWER</div><h2>'+esc(x.text)+'</h2><div class="answer">'+esc(x.answer)+'</div></div>';else stage.innerHTML='<div><div class="meta">TIEBREAKER</div><h1>'+esc(x.text)+'</h1></div>'}render();setInterval(render,1000);
const timerMuted=/^(0|off|false|no)$/i.test(new URLSearchParams(location.search).get("timer")||"");
function paintTimer(){const v=timerView(timerMuted?null:loadState().timer,Date.now());timerBar.hidden=!v.visible;if(!v.visible)return;timerBar.textContent=v.text;timerBar.setAttribute("aria-label",v.label);timerBar.className="timerbar "+v.state}
paintTimer();setInterval(paintTimer,250)</script></body></html>
