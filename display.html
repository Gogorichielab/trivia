<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Display | St. Peter Trivia</title><link rel="stylesheet" href="styles.css"></head><body><main id="stage" class="stage"></main><script src="game.js"></script><script>function render(){const g=loadGame(),s=loadState(),x=flatten(g)[s.index]||{};if(x.type==="round")stage.innerHTML='<div><div class="meta">NEXT ROUND</div><h1 class="round">'+x.title+'</h1></div>';else if(x.type==="question")stage.innerHTML='<div><div class="meta">'+g.rounds[x.round].name+' • Question '+(x.q+1)+'</div><h1>'+x.text+'</h1></div>';else if(x.type==="answer")stage.innerHTML='<div><div class="meta">ANSWER</div><h2>'+x.text+'</h2><div class="answer">'+x.answer+'</div></div>';else stage.innerHTML='<div><div class="meta">TIEBREAKER</div><h1>'+x.text+'</h1></div>'}render();setInterval(render,1000)</script></body></html>
