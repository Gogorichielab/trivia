<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Display | St. Peter Trivia</title><link rel="stylesheet" href="styles.css"></head><body><main id="stage" class="stage"></main><script src="game.js"></script><script>function render(){const g=loadGame(),s=loadState(),x=flatten(g)[s.index]||{};if(x.type==="round")stage.innerHTML='<div><div class="meta">NEXT ROUND</div><h1 class="round">'+esc(x.title)+'</h1></div>';else if(x.type==="question")stage.innerHTML='<div><div class="meta">'+esc(g.rounds[x.round].name)+' • Question '+(x.q+1)+'</div><h1>'+esc(x.text)+'</h1></div>';else if(x.type==="answer")stage.innerHTML='<div><div class="meta">ANSWER</div><h2>'+esc(x.text)+'</h2><div class="answer">'+esc(x.answer)+'</div></div>';else stage.innerHTML='<div><div class="meta">TIEBREAKER</div><h1>'+esc(x.text)+'</h1></div>'}render();setInterval(render,1000)</script></body></html>
