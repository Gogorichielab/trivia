name = "st-peter-trivia-sync"
main = "src/index.js"
compatibility_date = "2025-01-01"

# One Durable Object per game code holds that game's state.
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# SQLite-backed Durable Objects are the class available on the Workers free
# plan. Verify current free-tier limits before the event:
# https://developers.cloudflare.com/durable-objects/platform/pricing/
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[vars]
# Set to the GitHub Pages origin before the event so only that page can call
# the worker from a browser. "*" is fine while testing.
ALLOWED_ORIGIN = "*"

# HOST_TOKEN is a secret, never a var. Set it with:
#   npx wrangler secret put HOST_TOKEN
# Without it the worker refuses all writes rather than accepting anonymous ones.
