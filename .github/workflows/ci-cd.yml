name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # An identifier, not a credential -- it is already in docs/CLOUDFLARE.md.
  # Keeping it here means CLOUDFLARE_API_TOKEN is the only secret to set up.
  CLOUDFLARE_ACCOUNT_ID: 5ea902cfe05440351866b1a0f0535407

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate trivia app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html host.html display.html scoreboard.html styles.css game.js import.js timer.js fall-trivia.game.json vendor/papaparse.min.js vendor/xlsx.full.min.js; do
            test -s "$file" || { echo "::error file=$file::Missing or empty required file"; exit 1; }
          done

      - name: Validate game JSON
        run: python -m json.tool fall-trivia.game.json > /dev/null

      - name: Validate mock CSV data
        shell: python
        run: |
          import csv
          from pathlib import Path

          required_questions = {"round","category","question","answer","difficulty","points","host_notes"}
          required_teams = {"team_name","table_number"}

          def validate(path, required):
              with Path(path).open(newline="", encoding="utf-8-sig") as f:
                  reader = csv.DictReader(f)
                  headers = set(reader.fieldnames or [])
                  missing = required - headers
                  if missing:
                      raise SystemExit(f"{path}: missing columns: {sorted(missing)}")
                  rows = list(reader)
                  if not rows:
                      raise SystemExit(f"{path}: no data rows")
                  print(f"{path}: {len(rows)} rows OK")

          validate("mock/questions.csv", required_questions)
          validate("mock/teams.csv", required_teams)

      - name: Check internal page references
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'host.html' index.html
          grep -q 'display.html' index.html
          grep -q 'scoreboard.html' index.html

      # The old checks confirmed the game file parsed, which a file holding
      # five placeholder questions does. Warn when the fixture is not real
      # content, so a deploy cannot quietly ship placeholders to the TV.
      - name: Warn on placeholder game content
        shell: python
        run: |
          import json, os
          from pathlib import Path

          game = json.loads(Path("fall-trivia.game.json").read_text())
          rounds = game.get("rounds", [])
          counts = [len(r.get("questions", [])) for r in rounds]
          text = json.dumps(game).lower()

          notes = []
          if "placeholder" in text:
              notes.append("contains the word 'placeholder'")
          thin = [i + 1 for i, n in enumerate(counts) if n < 8]
          if thin:
              notes.append(f"rounds {thin} have fewer than 8 questions (counts: {counts})")

          if notes:
              print("::warning file=fall-trivia.game.json::Development fixture, not event content: "
                    + "; ".join(notes))
          else:
              print(f"fall-trivia.game.json: {len(rounds)} rounds, {sum(counts)} questions")

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run importer unit tests
        run: npm run test:unit

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, test]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://trivia.gogorichie.online
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Publish the app shell only. Anything published is world-readable, so
      # question and answer data stays out of it: mock/ holds an answer key,
      # and fall-trivia.game.json would hold the real one. The host loads the
      # game file from the laptop through the file picker.
      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          cp index.html host.html display.html scoreboard.html styles.css game.js import.js timer.js sync.js _site/
          cp -r vendor _site/vendor
          echo "Publishing:"
          find _site -type f | sort

      - name: Verify no answer data is being published
        shell: bash
        run: |
          set -euo pipefail
          if find _site \( -name '*.csv' -o -name '*.game.json' \) | grep -q .; then
            echo "::error::Question or answer data found in the publish directory"
            exit 1
          fi
          echo "No question or answer data in _site."

      - name: Check deploy credentials are present
        id: creds
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping deploy. See docs/CLOUDFLARE.md."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=st-peter-trivia --branch=main

  deploy-worker:
    name: Deploy sync worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check deploy credentials are present
        id: creds
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping worker deploy."
          fi

      # HOST_TOKEN is a secret set with `wrangler secret put`, not in the repo.
      # Redeploying the worker does not clear it.
      - name: Deploy worker
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
