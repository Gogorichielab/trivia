name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate trivia app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html host.html display.html scoreboard.html styles.css game.js import.js fall-trivia.game.json vendor/papaparse.min.js vendor/xlsx.full.min.js; do
            test -s "$file" || { echo "::error file=$file::Missing or empty required file"; exit 1; }
          done

      - name: Validate game JSON
        run: python -m json.tool fall-trivia.game.json > /dev/null

      - name: Validate mock CSV data
        shell: python
        run: |
          import csv
          from pathlib import Path

          required_questions = {"round","category","question","answer","difficulty","points","host_notes"}
          required_teams = {"team_name","table_number"}

          def validate(path, required):
              with Path(path).open(newline="", encoding="utf-8-sig") as f:
                  reader = csv.DictReader(f)
                  headers = set(reader.fieldnames or [])
                  missing = required - headers
                  if missing:
                      raise SystemExit(f"{path}: missing columns: {sorted(missing)}")
                  rows = list(reader)
                  if not rows:
                      raise SystemExit(f"{path}: no data rows")
                  print(f"{path}: {len(rows)} rows OK")

          validate("mock/questions.csv", required_questions)
          validate("mock/teams.csv", required_teams)

      - name: Check internal page references
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'host.html' index.html
          grep -q 'display.html' index.html
          grep -q 'scoreboard.html' index.html

      # The old checks confirmed the game file parsed, which a file holding
      # five placeholder questions does. Warn when the fixture is not real
      # content, so a deploy cannot quietly ship placeholders to the TV.
      - name: Warn on placeholder game content
        shell: python
        run: |
          import json, os
          from pathlib import Path

          game = json.loads(Path("fall-trivia.game.json").read_text())
          rounds = game.get("rounds", [])
          counts = [len(r.get("questions", [])) for r in rounds]
          text = json.dumps(game).lower()

          notes = []
          if "placeholder" in text:
              notes.append("contains the word 'placeholder'")
          thin = [i + 1 for i, n in enumerate(counts) if n < 8]
          if thin:
              notes.append(f"rounds {thin} have fewer than 8 questions (counts: {counts})")

          if notes:
              print("::warning file=fall-trivia.game.json::Development fixture, not event content: "
                    + "; ".join(notes))
          else:
              print(f"fall-trivia.game.json: {len(rounds)} rounds, {sum(counts)} questions")

  test:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run importer unit tests
        run: npm run test:unit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun

      - name: Upload Lighthouse report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, test, lighthouse]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish the app shell only. Anything published here is world-readable,
      # so question and answer data stays out of it: mock/ holds an answer key,
      # and fall-trivia.game.json would hold the real one. The host loads the
      # game file from the laptop through the file picker instead.
      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          cp index.html host.html display.html scoreboard.html styles.css game.js import.js _site/
          cp -r vendor _site/vendor
          echo "Publishing:"
          find _site -type f | sort

      - name: Verify no answer data is being published
        shell: bash
        run: |
          set -euo pipefail
          if find _site -name '*.csv' -o -name '*.game.json' | grep -q .; then
            echo "::error::Question or answer data found in the publish directory"
            exit 1
          fi
          echo "No question or answer data in _site."

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
